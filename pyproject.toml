[project]
name = "pyra"
version = "1.0.0"
description = "Modern Python IRC bot inspired by Sopel and Eggdrop"
authors = [{name = "Jarsky", email = "jarskynz@gmail.com"}]
requires-python = ">=3.12"
readme = "README.md"
license = {text = "MIT"}

dependencies = [
    "sqlalchemy[asyncio]>=2.1.6",
    "alembic>=1.20.1",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "pyyaml>=6.0.3",
    "bcrypt>=5.0.0",
    "loguru>=0.7.3",
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "jinja2>=3.1.6",
    "pyjwt>=2.15.1",
    "httpx>=0.28.1",
    "simpleeval>=1.0.8",
    "python-multipart>=0.0.32",
    "aiosqlite>=0.22.1",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.32.0"]
mysql = ["aiomysql>=0.3.2"]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "black>=26.10.1",
    "ruff>=0.17.2",
    "mypy>=2.4.0",
    "types-PyYAML>=6.0.12.20260906",
    "build>=1.6.1",
    "httpx2>=2.13.1",  # Starlette's TestClient (web page tests)
]

[project.scripts]
pybot = "pybot.__main__:main"
pybot-setup = "pybot.scripts.setup:main"
pybot-ctl = "pybot.scripts.ctl:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["pybot*"]

[tool.setuptools.package-data]
"pybot.web" = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "S"]
ignore = ["S101", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
