name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    - name: Install dependencies
      run: pip install -e ".[dev]"
    - name: Lint
      run: ruff check pybot/
    - name: Format check
      run: black --check pybot/
    - name: Type check
      run: mypy pybot/
    - name: Tests
      run: pytest tests/ --cov=pybot --cov-report=xml
